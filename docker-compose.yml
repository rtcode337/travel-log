name: travel-log

services:
  # 本体より先に、データの置き場(data/)の下へ必要なディレクトリを作り、
  # 所有者を実行ユーザーに合わせるワンショット。bindマウント先がホストに無いと
  # Dockerがそれをroot所有で作ってしまい、非rootで動くappが写真とエクスポートを
  # 書けずに落ちるため。appと同じイメージを使うのでpullは増えない。
  # db/ はchownしない —— postgresのエントリポイントがrootで起動して自分で揃える
  data-init:
    image: ghcr.io/rtcode337/travel-log:latest
    user: root
    volumes:
      - ./data:/data
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/db /data/photos /data/exports && chown -R "$$0" /data/photos /data/exports
      - ${TRAVEL_LOG_UID:-1000}:${TRAVEL_LOG_GID:-1000}
    restart: "no"

  db:
    image: postgres:18-alpine
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
      # データの置き場をdata/1つにまとめ、その下をdb/photos/exportsに切っている。
      # 既定(/var/lib/postgresql/18/docker)のままだとマウント直下に18/が来て
      # photos・exportsと同じ段に並ぶので、db/の下へ寄せる
      PGDATA: /var/lib/postgresql/db/18/docker
    volumes:
      # db/initはマウントしない。スキーマ本体(01_schema.sql)はinitサービスが流す
      # (git管理下のdb/initをコンテナに触らせるとホスト側のパーミッションが変わり、
      #  スキーマを更新したときにgit pullが失敗するようになるため)
      # postgres:18のイメージはVOLUME宣言が /var/lib/postgresql なので、そこを
      # マウントしないと匿名ボリュームが毎回作られる。データの置き場(data/)を
      # そのままここへ当て、実データは上のPGDATAで data/db/18/docker に入れる。
      # 所有者はpostgresのエントリポイント(rootで起動して自分で揃える)が調整する
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # スキーマ本体(/init/01_schema.sql)と未適用のマイグレーション(/migrations/*.sql)を
  # 順に自動適用するワンショット。イメージはappと同じくGitHub Actionsが
  # ビルド・公開したものをpullして使う(名前が-db-initなのはdb/Dockerfile参照)。
  # 適用済みリビジョンはschema_migrationsテーブルに記録され、2回目以降は何もせず終了する。
  # appはこれが正常終了するまで起動しない(古いスキーマのままアプリが動くのを防ぐ)
  init:
    image: ghcr.io/rtcode337/travel-log-db-init:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: travel_log
      PGPASSWORD: travel_log
      PGDATABASE: travel_log
    # ベースのpostgresイメージが宣言する VOLUME /var/lib/postgresql に何も
    # マウントしないと、起動のたびに空の匿名ボリュームが作られて溜まっていく。
    # このサービスはPGDATAを使わない(psqlクライアントとしてしか動かない)ので、
    # 使い捨てのtmpfsを当てて抑止する
    tmpfs:
      - /var/lib/postgresql
    restart: "no"

  app:
    # mainへのpushでGitHub Actions(.github/workflows/docker-publish.yml)がビルド・公開
    # するイメージ。本番ではビルドせず、更新は docker compose pull && docker compose up -d
    # だけでよい(README「本番運用」参照)
    image: ghcr.io/rtcode337/travel-log:latest
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (openssl rand -base64 32)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 公開URL(任意)。リバースプロキシがX-Forwarded-Proto/Hostを送らない構成では
      # これを設定しないとGoogleログインのリダイレクトURIがhttp://で組まれる
      # (lib/auth/request-url.ts)。例: https://travel.example.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NODE_ENV: production
      # 訪問記録の写真置き場(lib/photoStorage.ts)。DBには相対パスのみ保存される
      PHOTOS_DIR: /data/photos
      # エクスポートのZIP置き場(lib/exportStorage.ts)。写真と分けてあるのは寿命が
      # 違うため —— こちらは作り直せる使い捨てで、同じユーザーの最新1件だけ残る
      EXPORTS_DIR: /data/exports
    volumes:
      # 置き場ごとマウントして、中のどれを使うかは上のPHOTOS_DIR/EXPORTS_DIRで決める。
      # db/も見えるが、postgresがPGDATAを0700で作るのでappのユーザーからは読めない
      - ./data:/data
    # data/に書かれるファイルをホストのユーザー所有にする。イメージの既定は
    # node(uid/gidとも1000)で、ホスト側の所有者と合わないとbindマウントに書けない。
    # id -u が1000以外のホストでは.envのTRAVEL_LOG_UID/GIDで合わせる
    user: "${TRAVEL_LOG_UID:-1000}:${TRAVEL_LOG_GID:-1000}"
    ports:
      - "7040:7040"
    restart: unless-stopped
