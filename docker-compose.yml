name: travel-log

services:
  # dbの起動前に、bindマウント先(./db/data)の作成と所有者調整を行う
  # ワンショット(詳細はdb/entrypoint.shのprepare関数のコメント参照)。
  # イメージはappと同じくGitHub Actionsがビルド・公開したものをpullして使う
  db-init:
    image: ghcr.io/rtcode337/travel-log-db-init:latest
    user: root
    volumes:
      - ./db:/db
    # ベースのpostgresイメージが宣言する VOLUME /var/lib/postgresql/data に何も
    # マウントしないと、起動のたびに空の匿名ボリュームが作られて溜まっていく。
    # db-init/db-migrateはPGDATAを使わない(psqlクライアントとしてしか動かない)ので、
    # 使い捨てのtmpfsを当てて抑止する
    tmpfs:
      - /var/lib/postgresql/data
    command: ["prepare"]
    restart: "no"

  db:
    image: postgres:16-alpine
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
    volumes:
      # db/initはマウントしない。スキーマ本体(01_schema.sql)はdb-migrateが流す
      # (git管理下のdb/initをコンテナに触らせるとホスト側のパーミッションが変わり、
      #  スキーマを更新したときにgit pullが失敗するようになるため)
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # スキーマ本体(/init/01_schema.sql)と未適用のマイグレーション(/migrations/*.sql)を
  # 順に自動適用するワンショット。db-initと同じイメージのmigrateサブコマンド。
  # 適用済みリビジョンはschema_migrationsテーブルに記録され、2回目以降は何もせず終了する。
  # appはこれが正常終了するまで起動しない(古いスキーマのままアプリが動くのを防ぐ)
  db-migrate:
    image: ghcr.io/rtcode337/travel-log-db-init:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: travel_log
      PGPASSWORD: travel_log
      PGDATABASE: travel_log
    # 匿名ボリュームの抑止(理由はdb-init参照)
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

  app:
    # mainへのpushでGitHub Actions(.github/workflows/docker-publish.yml)がビルド・公開
    # するイメージ。本番ではビルドせず、更新は docker compose pull && docker compose up -d
    # だけでよい(README「本番運用」参照)
    image: ghcr.io/rtcode337/travel-log:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (openssl rand -base64 32)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 公開URL(任意)。リバースプロキシがX-Forwarded-Proto/Hostを送らない構成では
      # これを設定しないとGoogleログインのリダイレクトURIがhttp://で組まれる
      # (lib/auth/request-url.ts)。例: https://travel.example.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NODE_ENV: production
    volumes:
      # 訪問記録の写真ファイル置き場(lib/photos.ts)。DBには相対パスのみ保存される
      - ./photos:/app/photos
    ports:
      - "7040:7040"
    restart: unless-stopped
