name: travel-log

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
    volumes:
      # db/initはマウントしない。スキーマ本体(01_schema.sql)はinitサービスが流す
      # (git管理下のdb/initをコンテナに触らせるとホスト側のパーミッションが変わり、
      #  スキーマを更新したときにgit pullが失敗するようになるため)
      # postgres:18のイメージはPGDATAが /var/lib/postgresql/18/docker で、
      # VOLUME宣言も1段上の /var/lib/postgresql に変わった。マウント先を
      # /var/lib/postgresql/data のままにすると匿名ボリュームが毎回作られるため
      # 1段上をマウントする(実データはホストの data/18/docker に入る)。
      # dataが無ければDockerが作り、所有者はpostgresのエントリポイント
      # (rootで起動して自分で揃える)が調整する。bindマウント先を自動作成しない
      # 環境(一部のNAS等)では、先にディレクトリを作っておくこと
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # スキーマ本体(/init/01_schema.sql)と未適用のマイグレーション(/migrations/*.sql)を
  # 順に自動適用するワンショット。イメージはappと同じくGitHub Actionsが
  # ビルド・公開したものをpullして使う(名前が-db-initなのはdb/Dockerfile参照)。
  # 適用済みリビジョンはschema_migrationsテーブルに記録され、2回目以降は何もせず終了する。
  # appはこれが正常終了するまで起動しない(古いスキーマのままアプリが動くのを防ぐ)
  init:
    image: ghcr.io/rtcode337/travel-log-db-init:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: travel_log
      PGPASSWORD: travel_log
      PGDATABASE: travel_log
    # ベースのpostgresイメージが宣言する VOLUME /var/lib/postgresql に何も
    # マウントしないと、起動のたびに空の匿名ボリュームが作られて溜まっていく。
    # このサービスはPGDATAを使わない(psqlクライアントとしてしか動かない)ので、
    # 使い捨てのtmpfsを当てて抑止する
    tmpfs:
      - /var/lib/postgresql
    restart: "no"

  app:
    # mainへのpushでGitHub Actions(.github/workflows/docker-publish.yml)がビルド・公開
    # するイメージ。本番ではビルドせず、更新は docker compose pull && docker compose up -d
    # だけでよい(README「本番運用」参照)
    image: ghcr.io/rtcode337/travel-log:latest
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (openssl rand -base64 32)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 公開URL(任意)。リバースプロキシがX-Forwarded-Proto/Hostを送らない構成では
      # これを設定しないとGoogleログインのリダイレクトURIがhttp://で組まれる
      # (lib/auth/request-url.ts)。例: https://travel.example.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NODE_ENV: production
    volumes:
      # 訪問記録の写真ファイル置き場(lib/photos.ts)。DBには相対パスのみ保存される
      - ./photos:/app/photos
    ports:
      - "7040:7040"
    restart: unless-stopped
