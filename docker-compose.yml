name: travel-log-prod

services:
  # db/dataは.gitignore対象でgit管理下になく、cloneした直後は存在しない。dbサービスが
  # 直接./db/dataをbindマウントすると、環境によってはホスト側にディレクトリがない状態で
  # コンテナ起動そのものが失敗しうるため、db/init/*.sqlがgit管理下にあり必ず存在する親
  # ディレクトリ./db経由でmkdirし、postgres(uid/gid 70)に所有者を揃えてからdbを起動する。
  # あわせてdb/init配下(:roマウントされる初期化SQL)もホスト側のパーミッション次第では
  # postgresユーザーから読めないことがあるため、全員読み取り可にしておく
  db-init:
    image: postgres:16-alpine
    user: root
    volumes:
      - ./db:/db
    command: sh -c "mkdir -p /db/data && chown -R 70:70 /db/data && chmod -R a+rX /db/init"
    restart: "no"

  db:
    image: postgres:16-alpine
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (openssl rand -base64 32)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
    volumes:
      # 訪問記録の写真ファイル置き場(lib/photos.ts)。DBには相対パスのみ保存される
      - ./photos:/app/photos
    ports:
      - "3000:3000"
    restart: unless-stopped
