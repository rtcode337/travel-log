name: travel-log-prod

services:
  # NASのbindマウント(./db/data)の所有者がホスト側の任意ユーザーになっている場合に備え、
  # postgresコンテナ本体がinitdbを実行する前にrootで所有者をpostgres(uid/gid 70)へ揃える使い捨てコンテナ。
  # postgres公式イメージのentrypointは$PGDATA配下しかchownしないため、マウントルート自体の権限はここで直す必要がある
  db-init:
    image: postgres:16-alpine
    user: root
    volumes:
      - ./db/data:/var/lib/postgresql/data
    command: chown -R 70:70 /var/lib/postgresql/data
    restart: "no"

  db:
    image: postgres:16-alpine
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
      # db/data直下(bindマウントのルート)を直接PGDATAにすると、.gitkeepのような
      # ドットファイルの存在だけでinitdbが「マウントポイントを直接使うな」と
      # 初期化を拒否するため、1段掘ったサブディレクトリをPGDATAにする
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (openssl rand -base64 32)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
    volumes:
      # 訪問記録の写真ファイル置き場(lib/photos.ts)。DBには相対パスのみ保存される
      - ./photos:/app/photos
    ports:
      - "3000:3000"
    restart: unless-stopped
