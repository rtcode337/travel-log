name: travel-log-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
      # db/data直下(bindマウントのルート)を直接PGDATAにすると、.gitkeepのような
      # ドットファイルの存在だけでinitdbが「マウントポイントを直接使うな」と
      # 初期化を拒否するため、1段掘ったサブディレクトリをPGDATAにする
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 未適用のマイグレーションを連番順に自動適用するワンショット(本番と同じ仕組み)。
  # 開発では公開イメージをpullせず、db/Dockerfileをその場でビルドして使う
  db-migrate:
    build:
      context: ./db
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: travel_log
      PGPASSWORD: travel_log
      PGDATABASE: travel_log
    restart: "no"

  app:
    build:
      context: .
      target: dev
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
