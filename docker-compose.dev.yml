name: travel-log

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: travel_log
      POSTGRES_PASSWORD: travel_log
      POSTGRES_DB: travel_log
      # データの置き場をdata/1つにまとめ、その下をdb/photos/exportsに切っている
      # (本番と同じ形。docker-compose.ymlのdbサービスのコメント参照)
      PGDATA: /var/lib/postgresql/db/18/docker
    volumes:
      # db/initはマウントしない。スキーマ本体(01_schema.sql)はinitサービスが流す
      # (git管理下のdb/initをコンテナに触らせるとホスト側のパーミッションが変わり、
      #  スキーマを更新したときにgit pullが失敗するようになるため)
      # マウント先が /var/lib/postgresql/data ではなく1段上なのは本番用と同じ理由
      # (docker-compose.ymlのdbサービスのコメント参照)
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_log"]
      interval: 5s
      timeout: 5s
      retries: 10

  # スキーマ本体と未適用のマイグレーションを順に自動適用するワンショット(本番と同じ仕組み)。
  # 開発では公開イメージをpullせず、db/Dockerfileをその場でビルドして使う
  init:
    build:
      context: ./db
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: travel_log
      PGPASSWORD: travel_log
      PGDATABASE: travel_log
    # ベースのpostgresイメージが宣言する VOLUME /var/lib/postgresql に何も
    # マウントしないと、起動のたびに空の匿名ボリュームが作られて溜まっていく。
    # このサービスはPGDATAを使わない(psqlクライアントとしてしか動かない)ので、
    # 使い捨てのtmpfsを当てて抑止する
    tmpfs:
      - /var/lib/postgresql
    restart: "no"

  app:
    build:
      context: .
      target: dev
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://travel_log:travel_log@db:5432/travel_log
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 公開URL(任意)。本番と同じ挙動を手元で試したいときだけ設定する
      # (lib/auth/request-url.ts)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # スマホ実機など、LAN内の別端末から開発サーバを開くときに許可するホスト名・IP
      # (カンマ区切り)。未設定だと/_next配下の開発用リソースが403になり真っ白になる
      # (next.config.tsのallowedDevOrigins)。手元の.envに書く。
      # **1つでも書いたらlocalhost・127.0.0.1も一緒に書くこと**(書いたものだけが
      # 許可されるので、開発機自身のブラウザから開いても真っ白になる)
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
      NODE_ENV: development
      # 写真とエクスポートの置き場。本番と同じくdata/の下にそろえる
      # (リポジトリを/appにマウントしているので、ホストからは data/photos・data/exports)
      PHOTOS_DIR: /app/data/photos
      EXPORTS_DIR: /app/data/exports
    ports:
      - "7040:7040"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
